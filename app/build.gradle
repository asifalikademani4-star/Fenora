plugins { id 'com.android.application' }

android {
    namespace 'com.finora.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.finora.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }
}
